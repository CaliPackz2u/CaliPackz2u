<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaliPackz2u | Premium CaliPackz Bags</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome (Cart & Heart Icons) -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <!-- =========================
         NAVBAR
    ========================== -->

<header class="navbar">

    <div class="logo">

        <img src="./images/calipackz2u.png" alt="CaliPackz2U Logo">

        <h1>CaliPackz2u</h1>

    </div>

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

    </div>

    <div class="cart-button">

        <i class="fa-solid fa-cart-shopping"></i>

        <span id="cart-count">0</span>

    </div>

</header>

    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <h2>Premium Cali Pack Bags</h2>

        <p>
            High Quality • Competitive Prices
        </p>

    </section>

    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="container">

        <h2 class="section-title">
            Selection 
        </h2>

        <div id="products" class="products-grid">

            <!-- Products loaded from products.json -->

        </div>

    </main>

    <!-- =========================
         SHOPPING CART
    ========================== -->

    <section class="cart">

        <h2>

            <i class="fa-solid fa-cart-shopping"></i>

            Shopping Basket

        </h2>

        <div id="cart-items">

            <p class="empty-cart">

                Your basket is empty.

            </p>

        </div>

        <div class="cart-footer">

            <div class="cart-total">

                <span>Total</span>

                <strong>

                    £<span id="cart-total">0.00</span>

                </strong>

            </div>

            <button id="checkout-btn">

                Add Order 

            </button>

        </div>

    </section>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>

            © 2026 CaliPackz2U

        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
