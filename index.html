<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaliPackz2u | Premium CaliPackz Bags</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome (Cart & Heart Icons) -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <!-- =========================
         NAVBAR
    ========================== -->

<header class="navbar">

    <div class="logo">

        <img src="./images/calipackz2u.png" alt="CaliPackz2U Logo">

        <h1></h1>

    </div>
<div class="rating-grid">
    <div class="ratingrid-item">
    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

    </div>
    </div>
    <div class="ratingrid-item">
<button id="cart-button" class="cart-button">
    🛒
    
    <span id="cart-count">0</span>
</button>
</div>
   

</header>

    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

<div class="product-filters">

    <button
        class="filter-btn active"
        onclick="filterProducts('all', this)">
        All
    </button>

    <button
        class="filter-btn"
        onclick="filterProducts('in stock', this)">
        In Stock
    </button>

    <button
        class="filter-btn"
        onclick="filterProducts('out of stock', this)">
        Out of Stock
    </button>

    <button
        class="filter-btn"
        onclick="filterProducts('awaiting delivery', this)">
        Awaiting Delivery
    </button>

</div>
 <div class="view-switcher">
    <button
        id="large-view"
        class="view-btn active"
        onclick="setProductView('large')">
        ▦
    </button>

    <button
        id="compact-view"
        class="view-btn"
        onclick="setProductView('compact')">
        ▦▦
    </button>
</div>


        <h2>Premium Cali Pack Bags</h2>

        <p>
            High Quality • Competitive Prices
        </p>

    </section>
<!-- CART OVERLAY -->
<div id="cart-overlay" class="cart-overlay"></div>

<!-- SHOPPING CART -->
<div id="cart-panel" class="cart-panel">

    <div class="cart-header">

        <h2>🛒 Your Cart</h2>

        <button id="close-cart" class="close-cart">
            ×
        </button>

    </div>

    <div id="cart-items" class="cart-items">

        <p class="empty-cart">
            Your cart is empty.
        </p>

    </div>

    <div class="cart-footer">

        <div class="cart-total-row">

            <span>Total</span>

            <strong>
                £<span id="cart-total">0.00</span>
            </strong>

        </div>

        <button id="checkout-btn" class="checkout-btn">
            Checkout
        </button>

        <button
            onclick="clearCart()"
            class="clear-cart-btn">

            Clear Cart

        </button>

    </div>

</div>

    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="container">

        <h2 class="section-title">
            Selection 
        </h2>

        <div id="products" class="products-grid">

            <!-- Products loaded from products.json -->

        </div>

    </main>

    <!-- =========================
         SHOPPING CART
    ========================== -->


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>

            © 2026 CaliPackz2u

        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
