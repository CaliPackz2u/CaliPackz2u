<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaliPackz2U</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===========================
         NAVBAR
    ============================ -->

    <header class="navbar">
        <div class="logo">
            <h1>CaliPackz2U</h1>
        </div>

        <div class="cart-icon">
            🛒 Cart
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- ===========================
         HERO
    ============================ -->

    <section class="hero">
        <h2>Premium Custom Mylar Bags</h2>

        <p>
            High Quality Packaging at Affordable Prices
        </p>
    </section>

    <!-- ===========================
         PRODUCTS
    ============================ -->

    <main>

        <section class="products-section">

            <h2>Our Products</h2>

            <div id="products" class="products-grid">

                <!-- Products from products.json appear here -->

            </div>

        </section>

    </main>

    <!-- ===========================
         SHOPPING CART
    ============================ -->

    <aside class="cart">

        <h2>Shopping Cart</h2>

        <div id="cart-items">

            <p>Your cart is empty.</p>

        </div>

        <hr>

        <div class="cart-total">

            <h3>Total</h3>

            <h2>£<span id="cart-total">0.00</span></h2>

        </div>

    </aside>

    <!-- ===========================
         FOOTER
    ============================ -->

    <footer>

        <p>
            © 2026 CaliPackz2U. All Rights Reserved.
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
