<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaliPackz2U | Premium Mylar Bags</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome (Cart & Heart Icons) -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            <h1>CaliPackz2U</h1>
        </div>

        <div class="cart-button">

            <i class="fa-solid fa-cart-shopping"></i>

            <span>Cart</span>

            <span id="cart-count">0</span>

        </div>

    </header>

    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <h2>Premium Custom Mylar Packaging</h2>

        <p>
            High Quality • Fast Dispatch • Affordable Prices
        </p>

    </section>

    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="container">

        <h2 class="section-title">
            Our Products
        </h2>

        <div id="products" class="products-grid">

            <!-- Products loaded from products.json -->

        </div>

    </main>

    <!-- =========================
         SHOPPING CART
    ========================== -->

    <section class="cart">

        <h2>

            <i class="fa-solid fa-cart-shopping"></i>

            Shopping Cart

        </h2>

        <div id="cart-items">

            <p class="empty-cart">

                Your cart is empty.

            </p>

        </div>

        <div class="cart-footer">

            <div class="cart-total">

                <span>Total</span>

                <strong>

                    £<span id="cart-total">0.00</span>

                </strong>

            </div>

            <button id="checkout-btn">

                Checkout

            </button>

        </div>

    </section>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>

            © 2026 CaliPackz2U

        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
